[project]
name = "job-crawler"
version = "1.2.1"
description = "IT job crawler (itviec + topcv) HCMC — clean data, Windmill scheduler, dashboard"
requires-python = ">=3.11"
dependencies = [
  "curl_cffi>=0.15",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
job-crawler = "job_crawler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
