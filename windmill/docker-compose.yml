name: jobcrawler-windmill   # project DUY NHẤT của job-crawler — không đụng windmill dự án khác

x-logging: &default-logging
  driver: "json-file"
  options: { max-size: "20m", max-file: "5" }

# Orchestration Windmill cho job-crawler — UI theo dõi pipeline: bấm Run /
# schedule tự chạy / thấy success-failure từng flow.
# Worker mount repo NGUYÊN path (giống host) để script bash gọi thẳng
# .venv/bin/job-crawler — không cần cài lại dependency trong container.
# Khởi động: cd windmill && docker compose up -d  → UI http://localhost:8132
services:
  db:
    image: postgres:16
    restart: unless-stopped
    volumes: [db_data:/var/lib/postgresql/data]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windmill_local}
      POSTGRES_DB: windmill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
    networks: [windmill-network]

  server:
    image: ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:main}
    pull_policy: missing
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports: ["${WM_PORT:-8132}:8000"]
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-windmill_local}@db:5432/windmill?sslmode=disable
      - MODE=server
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@jobcrawler.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    depends_on:
      db: { condition: service_healthy }
    networks: [windmill-network]

  worker:
    image: ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:main}
    pull_policy: missing
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    user: "1000:1000"          # trùng uid dataguy — ghi được SQLite/raw của repo
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-windmill_local}@db:5432/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUPS_ALLOW_ALL=true
      - HOME=/tmp
    volumes:
      - ${REPO_DIR:-..}:/home/dataguy/Documents/projects/_personal/job-crawler
      # venv trỏ interpreter uv của host — mount cho symlink sống trong container
      - /home/dataguy/.local/share/uv/python:/home/dataguy/.local/share/uv/python:ro
    depends_on:
      server: { condition: service_started }
    networks: [windmill-network]
    # Windmill chỉ chạy 1 job/worker (bash không dùng native mode). Scale bằng
    # nhiều container để deep/companies không chặn lượt quick 5-10 phút;
    # SQLite WAL + per-source lock tự xử lý ghi song song.
    deploy:
      replicas: 4

volumes:
  db_data:

networks:
  windmill-network:
